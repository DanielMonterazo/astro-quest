<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <title>Astronauta do jogo (vista frontal, vetorial)</title>
  <defs>
    <radialGradient id="traje" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f4f1ea"/><stop offset="1" stop-color="#d9d4ca"/></radialGradient>
    <radialGradient id="pele" cx="42%" cy="38%" r="65%"><stop offset="0" stop-color="#f4c39a"/><stop offset="1" stop-color="#d9915e"/></radialGradient>
    <radialGradient id="vidro" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".55" stop-color="#cfefff" stop-opacity=".18"/><stop offset="1" stop-color="#9fd3f0" stop-opacity=".3"/></radialGradient>
    <linearGradient id="laranja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59a45"/><stop offset="1" stop-color="#d9661a"/></linearGradient>
  </defs>
  <g stroke="#2a1f2e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- antena -->
    <line x1="470" y1="205" x2="470" y2="96" fill="none"/>
    <circle cx="470" cy="82" r="22" fill="#ff5a4d"/>
    <!-- pernas e botas -->
    <rect x="296" y="800" width="78" height="100" rx="14" fill="url(#traje)"/>
    <rect x="426" y="800" width="78" height="100" rx="14" fill="url(#traje)"/>
    <rect x="284" y="886" width="100" height="72" rx="16" fill="url(#laranja)"/>
    <rect x="416" y="886" width="100" height="72" rx="16" fill="url(#laranja)"/>
    <!-- braços e luvas -->
    <path d="M212 585 L262 572 L250 720 L200 728 Z" fill="url(#traje)"/>
    <path d="M588 585 L538 572 L550 720 L600 728 Z" fill="url(#traje)"/>
    <circle cx="202" cy="742" r="42" fill="url(#laranja)"/>
    <circle cx="598" cy="742" r="42" fill="url(#laranja)"/>
    <!-- corpo -->
    <ellipse cx="400" cy="700" rx="152" ry="178" fill="url(#traje)"/>
    <rect x="342" y="618" width="116" height="78" rx="10" fill="#3a4a5a"/>
    <circle cx="370" cy="657" r="11" fill="#ff5a4d" stroke-width="4"/>
    <circle cx="400" cy="657" r="11" fill="#ffc94d" stroke-width="4"/>
    <circle cx="430" cy="657" r="11" fill="#5fd3a6" stroke-width="4"/>
    <!-- capacete: aro e protetores -->
    <circle cx="400" cy="372" r="200" fill="#f4f1ea"/>
    <rect x="174" y="342" width="40" height="90" rx="12" fill="url(#laranja)"/>
    <rect x="586" y="342" width="40" height="90" rx="12" fill="url(#laranja)"/>
    <!-- rosto -->
    <circle cx="400" cy="384" r="168" fill="#e6f5fc" stroke="none"/>
    <path d="M262 330 Q300 232 400 228 Q505 232 540 330 Q470 278 400 280 Q330 278 262 330 Z" fill="#5a3524" stroke="none"/>
    <circle cx="400" cy="392" r="142" fill="url(#pele)" stroke="none"/>
    <path d="M272 352 Q300 250 400 246 Q500 250 528 352 Q470 300 400 304 Q330 300 272 352 Z" fill="#5a3524" stroke="none"/>
    <circle cx="341" cy="372" r="26" fill="#1b1220" stroke="none"/>
    <circle cx="459" cy="372" r="26" fill="#1b1220" stroke="none"/>
    <circle cx="350" cy="362" r="9" fill="#fff" stroke="none"/>
    <circle cx="468" cy="362" r="9" fill="#fff" stroke="none"/>
    <ellipse cx="296" cy="420" rx="22" ry="13" fill="#ff8fa3" opacity=".85" stroke="none"/>
    <ellipse cx="504" cy="420" rx="22" ry="13" fill="#ff8fa3" opacity=".85" stroke="none"/>
    <path d="M366 418 Q400 456 434 418" fill="none" stroke="#1b1220" stroke-width="11"/>
    <!-- viseira de vidro -->
    <circle cx="400" cy="384" r="168" fill="url(#vidro)"/>
    <path d="M296 268 Q330 236 372 228" fill="none" stroke="#ffffff" stroke-width="12" opacity=".8"/>
    <!-- gola -->
    <rect x="270" y="536" width="260" height="48" rx="24" fill="url(#laranja)"/>
  </g>
</svg>
