<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t">
  <title id="t">Cartão-postal: o astronauta sorrindo e acenando na cratera Gale, em Marte</title>
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3b27a"/>
      <stop offset=".55" stop-color="#e9925c"/>
      <stop offset="1" stop-color="#d9784a"/>
    </linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4703f"/>
      <stop offset="1" stop-color="#b9572e"/>
    </linearGradient>
    <radialGradient id="sol" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset=".45" stop-color="#ffe2b0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="foto"><rect x="70" y="70" width="1060" height="610" rx="18"/></clipPath>
  </defs>

  <!-- papel do cartão -->
  <rect width="1200" height="800" fill="#fbf4e6"/>
  <rect x="18" y="18" width="1164" height="764" rx="26" fill="none" stroke="#e7d8bd" stroke-width="4"/>

  <g clip-path="url(#foto)">
    <!-- céu de Marte -->
    <rect x="70" y="70" width="1060" height="610" fill="url(#ceu)"/>
    <circle cx="960" cy="190" r="90" fill="url(#sol)"/>
    <circle cx="960" cy="190" r="22" fill="#fff8ea"/>
    <!-- Fobos -->
    <ellipse cx="240" cy="150" rx="13" ry="9" fill="#c98c66" opacity=".7"/>

    <!-- borda da cratera ao fundo -->
    <path d="M70 430 Q190 360 300 400 T520 380 T760 400 T980 370 T1130 400 V680 H70Z" fill="#d98757" opacity=".7"/>
    <!-- Monte Sharp -->
    <path d="M610 470 L760 300 Q790 270 820 300 L880 360 L930 330 L1060 470Z" fill="#c9774a"/>
    <path d="M700 380 Q770 372 840 392 M680 410 Q780 398 880 420 M740 340 Q790 334 830 350" stroke="#e3a074" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
    <!-- chão -->
    <path d="M70 470 Q300 440 600 465 T1130 455 V680 H70Z" fill="url(#chao)"/>
    <!-- pedrinhas -->
    <g fill="#9e4a27">
      <ellipse cx="180" cy="610" rx="34" ry="14"/>
      <ellipse cx="1010" cy="600" rx="44" ry="16"/>
      <ellipse cx="880" cy="640" rx="18" ry="8"/>
      <ellipse cx="300" cy="560" rx="14" ry="6"/>
      <ellipse cx="1070" cy="530" rx="12" ry="5"/>
    </g>
    <!-- base ao longe: domo, moradia e torre -->
    <g transform="translate(150 445)">
      <path d="M0 22 A42 42 0 0 1 84 22Z" fill="#f2f6f8" stroke="#8fd3e0" stroke-width="3"/>
      <path d="M14 22 A28 28 0 0 1 70 22" fill="none" stroke="#8fd3e0" stroke-width="2"/>
      <rect x="96" y="0" width="64" height="22" rx="11" fill="#eef1f3" stroke="#b9c3c9" stroke-width="2"/>
      <rect x="176" y="-6" width="40" height="28" rx="14" fill="#eef1f3" stroke="#b9c3c9" stroke-width="2"/>
      <line x1="240" y1="22" x2="240" y2="-46" stroke="#5a4a42" stroke-width="4"/>
      <circle cx="240" cy="-50" r="7" fill="#e85d4a"/>
      <!-- rover R-1 -->
      <rect x="276" y="4" width="46" height="14" rx="4" fill="#f4f4f2" stroke="#5a4a42" stroke-width="2"/>
      <circle cx="284" cy="21" r="5" fill="#3a2e2a"/><circle cx="299" cy="21" r="5" fill="#3a2e2a"/><circle cx="314" cy="21" r="5" fill="#3a2e2a"/>
    </g>

    <!-- ===== astronauta (mesmo estilo do retrato do jogo) ===== -->
    <g transform="translate(600 430)">
      <!-- sombra -->
      <ellipse cx="0" cy="238" rx="150" ry="22" fill="#8f3f1e" opacity=".35"/>
      <!-- pernas e botas -->
      <rect x="-70" y="120" width="56" height="100" rx="24" fill="#f3f1ec" stroke="#2a2220" stroke-width="6"/>
      <rect x="14" y="120" width="56" height="100" rx="24" fill="#f3f1ec" stroke="#2a2220" stroke-width="6"/>
      <rect x="-80" y="196" width="72" height="38" rx="16" fill="#3a2e2a"/>
      <rect x="8" y="196" width="72" height="38" rx="16" fill="#3a2e2a"/>
      <!-- mochila -->
      <rect x="-104" y="-40" width="208" height="150" rx="34" fill="#d7dde0" stroke="#2a2220" stroke-width="6"/>
      <!-- braço esquerdo (abaixado) -->
      <path d="M-92 10 Q-150 70 -128 150" fill="none" stroke="#2a2220" stroke-width="56" stroke-linecap="round"/>
      <path d="M-92 10 Q-150 70 -128 150" fill="none" stroke="#f3f1ec" stroke-width="44" stroke-linecap="round"/>
      <circle cx="-128" cy="156" r="24" fill="#e58a3c" stroke="#2a2220" stroke-width="6"/>
      <!-- braço direito acenando -->
      <path d="M92 10 Q160 -20 168 -110" fill="none" stroke="#2a2220" stroke-width="56" stroke-linecap="round"/>
      <path d="M92 10 Q160 -20 168 -110" fill="none" stroke="#f3f1ec" stroke-width="44" stroke-linecap="round"/>
      <circle cx="170" cy="-124" r="26" fill="#e58a3c" stroke="#2a2220" stroke-width="6"/>
      <!-- linhas de aceno -->
      <path d="M212 -160 q14 -10 22 4 M222 -124 q18 -2 22 12 M206 -196 q10 -16 26 -8" fill="none" stroke="#fff8ea" stroke-width="6" stroke-linecap="round"/>
      <!-- corpo -->
      <rect x="-96" y="-10" width="192" height="160" rx="70" fill="#f3f1ec" stroke="#2a2220" stroke-width="6"/>
      <!-- painel do peito -->
      <rect x="-42" y="40" width="84" height="54" rx="12" fill="#2a2220"/>
      <circle cx="-20" cy="60" r="8" fill="#e85d4a"/>
      <circle cx="4" cy="60" r="8" fill="#8ff0ff"/>
      <rect x="-28" y="76" width="56" height="8" rx="4" fill="#e58a3c"/>
      <!-- capacete -->
      <circle cx="0" cy="-130" r="138" fill="#8ff0ff"/>
      <circle cx="0" cy="-130" r="128" fill="#2a2220"/>
      <circle cx="0" cy="-130" r="108" fill="#f3f1ec"/>
      <circle cx="0" cy="-130" r="88" fill="#e3f1f6"/>
      <!-- fones laterais -->
      <rect x="-130" y="-158" width="22" height="56" rx="10" fill="#e58a3c"/>
      <rect x="108" y="-158" width="22" height="56" rx="10" fill="#e58a3c"/>
      <!-- antena -->
      <line x1="60" y1="-228" x2="92" y2="-282" stroke="#2a2220" stroke-width="12" stroke-linecap="round"/>
      <circle cx="98" cy="-292" r="22" fill="#e85d4a"/>
      <!-- rosto -->
      <circle cx="0" cy="-122" r="72" fill="#e0aa7c"/>
      <path d="M-72 -128 Q-70 -200 0 -200 Q70 -200 72 -128 Q40 -168 0 -166 Q-40 -168 -72 -128Z" fill="#5b3a26"/>
      <!-- olhos felizes -->
      <circle cx="-28" cy="-120" r="14" fill="#1e1614"/>
      <circle cx="28" cy="-120" r="14" fill="#1e1614"/>
      <circle cx="-23" cy="-125" r="5" fill="#fff"/>
      <circle cx="33" cy="-125" r="5" fill="#fff"/>
      <!-- bochechas -->
      <ellipse cx="-48" cy="-96" rx="13" ry="8" fill="#f2a0a6"/>
      <ellipse cx="48" cy="-96" rx="13" ry="8" fill="#f2a0a6"/>
      <!-- sorrisão -->
      <path d="M-38 -98 Q0 -40 38 -98 Q0 -88 -38 -98Z" fill="#1e1614"/>
      <path d="M-30 -94 Q0 -88 30 -94 L28 -90 Q0 -84 -28 -90Z" fill="#fff"/>
      <path d="M-18 -66 Q0 -56 18 -66 Q0 -76 -18 -66Z" fill="#e8656b"/>
      <!-- reflexo do visor -->
      <path d="M-70 -190 Q-40 -214 -4 -212" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".8"/>
    </g>
  </g>
  <rect x="70" y="70" width="1060" height="610" rx="18" fill="none" stroke="#2a2220" stroke-width="6"/>

  <!-- selo -->
  <g transform="translate(1000 92) rotate(4)">
    <rect x="0" y="0" width="104" height="124" rx="6" fill="#fff" stroke="#d9c7a3" stroke-width="3" stroke-dasharray="6 5"/>
    <rect x="10" y="10" width="84" height="80" rx="4" fill="#e58a3c"/>
    <circle cx="52" cy="50" r="26" fill="#c9562c"/>
    <circle cx="44" cy="42" r="6" fill="#a8441f"/><circle cx="62" cy="58" r="4" fill="#a8441f"/>
    <text x="52" y="110" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="15" fill="#2a2220">MARTE</text>
  </g>

  <!-- legenda do cartão -->
  <text x="80" y="738" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="50" fill="#c9562c">Lembranças de Marte!</text>
  <text x="1120" y="738" text-anchor="end" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="600" font-size="28" fill="#5a4a42">Cratera Gale · Sol 1</text>
</svg>
